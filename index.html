
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101020">
<title>Ultimate Game Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">🎮 ULTIMATE <span>GAME HUB</span></div>
  <button id="themeBtn">☀️</button>
</header>

<section class="hero">
  <div>
    <p class="tag">YOUR PERSONAL ARCADE</p>
    <h1>Play. Explore.<br><span>Repeat.</span></h1>
    <p>Classic memories. Modern gaming.</p>
    <button class="primary" onclick="showGames()">EXPLORE GAMES →</button>
  </div>
  <div class="hero-art">👾<br>🎮</div>
</section>

<section class="stats">
  <div><b id="totalGames">6</b><small>Games</small></div>
  <div><b id="played">0</b><small>Games played</small></div>
  <div><b id="bestScore">0</b><small>Best score</small></div>
</section>

<main>
  <div class="heading">
    <h2>Explore Games</h2>
    <input id="search" placeholder="🔍 Search games...">
  </div>

  <nav id="categories">
    <button class="active" data-category="All">All</button>
    <button data-category="Classic">Classic</button>
    <button data-category="Puzzle">Puzzle</button>
    <button data-category="Arcade">Arcade</button>
    <button data-category="Multiplayer">Multiplayer</button>
    <button data-category="Favorites">❤️ Favorites</button>
  </nav>

  <div id="games" class="game-grid"></div>
</main>

<div id="player" class="hidden">
  <div class="game-top">
    <button onclick="closeGame()">← Back</button>
    <h2 id="gameTitle">Game</h2>
    <button onclick="restartGame()">↻</button>
  </div>
  <div id="gameArea"></div>
</div>

<footer>
  <h3>ULTIMATE GAME HUB</h3>
  <p>One hub. Endless fun.</p>
  <small>Version 1.0 • Built for mobile and PC</small>
</footer>

<script src="app.js"></script>
</body>
</html>
