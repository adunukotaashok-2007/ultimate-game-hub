
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTIMATE GAME HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎮 ULTIMATE GAME HUB</h1>
    <p>10 ARCADE GAMES • 300 LEVELS</p>
    <input id="search" placeholder="Search games...">
  </header>

  <main>
    <section class="hero">
      <h2>ENTER THE ARCADE</h2>
      <p>Play more. Win more. Unlock every level.</p>
      <h3>⭐ Total Stars: <span id="stars">0</span></h3>
    </section>

    <section id="games" class="games"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="game-window">
      <div class="game-heading">
        <div>
          <h2 id="gameTitle">Game</h2>
          <p id="levelText">Level 1 / 30</p>
        </div>
        <button id="close">✕</button>
      </div>

      <div class="stats">
        <span id="score">Score: 0</span>
        <span id="lives">❤️ 3</span>
      </div>

      <canvas id="game" width="800" height="500"></canvas>

      <div id="message">
        <h2 id="messageTitle">READY?</h2>
        <p id="messageText">Start your adventure!</p>
        <button id="start">START GAME</button>
      </div>

      <div class="controls">
        <button data-key="ArrowLeft">◀</button>
        <button data-key="ArrowUp">▲</button>
        <button data-key="ArrowDown">▼</button>
        <button data-key="ArrowRight">▶</button>
        <button data-key="Space">FIRE / JUMP</button>
      </div>

      <p id="instructions"></p>
      <button id="restart">RESTART LEVEL</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
